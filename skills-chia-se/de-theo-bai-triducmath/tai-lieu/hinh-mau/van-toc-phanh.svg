<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" font-family="Times New Roman" font-size="17">
  <defs>
    <marker id="mui" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#000"/>
    </marker>
  </defs>
  <rect width="420" height="300" fill="#fff"/>
  <!-- Vùng dưới đồ thị v(t) = 10 − 2t trên [0; 5]: gốc O(50,260), 1 giây = 60 px, 1 m/s = 20 px -->
  <polygon points="50,260 50,60 350,260" fill="#cfe3ff" fill-opacity="0.8"/>
  <!-- Trục -->
  <line x1="40" y1="260" x2="400" y2="260" stroke="#000" stroke-width="1.5" marker-end="url(#mui)"/>
  <line x1="50" y1="275" x2="50" y2="25" stroke="#000" stroke-width="1.5" marker-end="url(#mui)"/>
  <text x="392" y="282" font-style="italic">t</text>
  <text x="58" y="32" font-style="italic">v</text>
  <text x="32" y="280" font-style="italic">O</text>
  <!-- Vạch chia -->
  <g stroke="#000" stroke-width="1">
    <line x1="110" y1="256" x2="110" y2="264"/><line x1="170" y1="256" x2="170" y2="264"/>
    <line x1="230" y1="256" x2="230" y2="264"/><line x1="290" y1="256" x2="290" y2="264"/>
    <line x1="350" y1="256" x2="350" y2="264"/>
    <line x1="46" y1="160" x2="54" y2="160"/><line x1="46" y1="60" x2="54" y2="60"/>
  </g>
  <text x="105" y="282">1</text><text x="165" y="282">2</text><text x="225" y="282">3</text>
  <text x="285" y="282">4</text><text x="345" y="282">5</text>
  <text x="30" y="166">5</text><text x="22" y="66">10</text>
  <!-- Đồ thị -->
  <line x1="50" y1="60" x2="350" y2="260" stroke="#1f4fa8" stroke-width="2.2"/>
  <text x="215" y="140" fill="#1f4fa8" font-style="italic">v = 10 − 2t</text>
</svg>
