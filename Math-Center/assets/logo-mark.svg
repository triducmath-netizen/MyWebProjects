<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="tdm-title">
  <title id="tdm-title">Trí Đức Math</title>
  <style>
    .tdm-primary { fill: #13294B; }
    .tdm-light   { fill: #FFFFFF; }
    .tdm-accent  { fill: none; stroke: #C9A23F; stroke-width: 4; stroke-linecap: round; }
  </style>
  <rect class="tdm-primary" x="0" y="0" width="64" height="64" rx="14"/>
  <!-- T: thanh ngang đồng thời là nét gạch của Đ -->
  <rect class="tdm-light" x="12" y="14" width="30" height="6" rx="1"/>
  <rect class="tdm-light" x="24" y="14" width="6" height="36" rx="1"/>
  <!-- Cung compa: thân chữ Đ, thể hiện Đức -->
  <path class="tdm-accent" d="M36 24 A13 13 0 0 1 36 50"/>
  <circle cx="50" cy="16" r="3.5" fill="#C9A23F"/>
</svg>
