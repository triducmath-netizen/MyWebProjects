# Xuất bản thư mục Math-Center lên GitHub Pages mỗi khi push lên nhánh main.
# Nếu bước deploy lỗi tạm thời phía GitHub, có thể chạy lại ở tab Actions → Run workflow.
name: Deploy Math-Center to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "Math-Center/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: Math-Center
      - id: deployment
        uses: actions/deploy-pages@v5
